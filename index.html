function getSeries(key){return LIBRARY.find(s=>s.key===key)}function hasSeasons(s){return Array.isArray(s?.seasons)&&s.seasons.length>0}function getAllEpisodes(s){if(!s)return[];return hasSeasons(s)?s.seasons.flatMap((season,si)=>season.episodes.map((ep,idx)=>({...ep,seasonIndex:si,idx,seasonName:season.name}))):(s.episodes||[]).map((ep,idx)=>({...ep,seasonIndex:null,idx,seasonName:null}))}function getTotalEpisodes(s){return getAllEpisodes(s).length}function firstPlayable(s){const p=progress()[s.key];if(p)return p;const ep=getAllEpisodes(s)[0];return ep?{seriesKey:s.key,seasonIndex:ep.seasonIndex,idx:ep.idx}:null}function epKey(seriesKey,seasonIndex,idx){return `${seriesKey}:${seasonIndex??'single'}:${idx}`}function isFav(key){return favs().includes(key)}function getEpisode(seriesKey,seasonIndex,idx){const s=getSeries(seriesKey);if(!s)return null;return hasSeasons(s)&&seasonIndex!==null?s.seasons[seasonIndex]?.episodes[idx]:s.episodes?.[idx]}function escapeHtml(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}function tag(t){return `<span class="pill">${escapeHtml(String(t))}</span>`}

function setHero(key){const s=getSeries(key);if(!s)return;currentSeriesKey=key;heroBg.style.backgroundImage=`url('${s.poster}')`;heroTitle.textContent=s.name;heroDesc.textContent=s.desc||'Clique para abrir e escolher episódios.';heroMeta.innerHTML=tag(s.type)+tag(`${getTotalEpisodes(s)} eps`)+(hasSeasons(s)?tag(`${s.seasons.length} temporadas`):'')+(isFav(s.key)?tag('⭐ favorito'):'');heroEpisodes.onclick=()=>openEpisodes(s.key);heroContinue.onclick=()=>{const p=firstPlayable(s);if(p)playEpisode(p.seriesKey,p.idx,p.seasonIndex)};heroFav.textContent=isFav(s.key)?'⭐ Favorito':'☆ Favoritar';heroFav.onclick=()=>toggleFav(s.key)}
function renderHome(){homeView.classList.remove('hide');episodesView.classList.add('hide');playerWrap.style.display='none';const q=(globalSearch.value||'').trim().toLowerCase();let list=LIBRARY.filter(s=>{if(currentMode==='favorites'&&!isFav(s.key))return false;if(!q)return true;return s.name.toLowerCase().includes(q)||getAllEpisodes(s).some(ep=>(ep.title+' '+(ep.seasonName||'')).toLowerCase().includes(q))});rowTitle.textContent=currentMode==='favorites'?'Favoritos':'Donghuas';pillCount.textContent=`${list.length} item(ns)`;donghuaRow.innerHTML='';if(!list.length){donghuaRow.innerHTML='<div class="empty">Nada encontrado. Use a busca ou adicione favoritos com ⭐.</div>';continueHome.innerHTML='';return}if(!list.some(s=>s.key===currentSeriesKey))currentSeriesKey=list[0].key;setHero(currentSeriesKey);list.forEach(s=>{const p=progress()[s.key],percent=p?70:0;const div=document.createElement('article');div.className='card focusable';div.tabIndex=0;div.dataset.key=s.key;div.innerHTML=`<span class="previewBadge">Preview</span><button class="fav ${isFav(s.key)?'on':''}" title="Favoritar">${isFav(s.key)?'★':'☆'}</button><img class="poster" src="${s.poster}" alt="${escapeHtml(s.name)}" onerror="this.src='images/placeholder.jpg'"><div class="cardGrad"></div><div class="cardPad"><div class="cardTitle">${escapeHtml(s.name)}</div><div class="cardMeta"><span>${escapeHtml(s.type)}</span><span>•</span><span>${getTotalEpisodes(s)} eps</span>${hasSeasons(s)?`<span>•</span><span>${s.seasons.length} temp.</span>`:''}</div><div class="progressTrack"><div class="progressFill" style="width:${percent}%"></div></div></div>`;div.onmouseenter=()=>setHero(s.key);div.onfocus=()=>setHero(s.key);div.onclick=(e)=>{if(e.target.classList.contains('fav')){e.stopPropagation();toggleFav(s.key);return}openEpisodes(s.key)};donghuaRow.appendChild(div)});renderContinuePanels();updateFocusable();history.replaceState({view:'home'},'',location.pathname)}
function renderContinuePanels(){const p=progress(),entries=Object.values(p).sort((a,b)=>(b.at||0)-(a.at||0));function panel(entry){const s=getSeries(entry.seriesKey),ep=getEpisode(entry.seriesKey,entry.seasonIndex,entry.idx);if(!s||!ep)return'';const sn=entry.seasonIndex!==null?s.seasons[entry.seasonIndex].name:'';return `<div class="continuePanel"><img src="${s.poster}" onerror="this.src='images/placeholder.jpg'" alt=""><div><b>Continuar: ${escapeHtml(s.name)}</b><span>${escapeHtml(sn)} ${escapeHtml(ep.title)}</span></div><button class="btn primary focusable" onclick="playEpisode('${s.key}',${entry.idx},${entry.seasonIndex===null?'null':entry.seasonIndex})">▶ Continuar</button></div>`}continueHome.innerHTML=entries[0]?panel(entries[0]):'';const curr=progress()[currentSeriesKey];continueSeries.innerHTML=curr?panel(curr):''}
function openHome(push=true){currentSeasonIndex=null;currentEpisodeIndex=null;currentMode='all';renderHome();if(push)history.pushState({view:'home'},'',location.pathname)}function openEpisodes(key,seasonIndex=null,push=true){const s=getSeries(key);if(!s)return;currentSeriesKey=key;currentSeasonIndex=seasonIndex;currentEpisodeIndex=null;homeView.classList.add('hide');episodesView.classList.remove('hide');playerWrap.style.display='none';seriesTitle.textContent=s.name;seriesName.textContent=s.name;seriesDesc.textContent=s.desc||'';seriesPoster.src=s.poster;seriesHeaderBg.style.backgroundImage=`url('${s.poster}')`;seriesMeta.innerHTML=tag(s.type)+tag(`${getTotalEpisodes(s)} eps`)+(hasSeasons(s)?tag(`${s.seasons.length} temporadas`):'');seriesFavBtn.textContent=isFav(s.key)?'⭐ Favorito':'☆ Favoritar';seriesFavBtn.onclick=()=>toggleFav(s.key);playFirstBtn.onclick=()=>{const p=firstPlayable(s);if(p)playEpisode(p.seriesKey,p.idx,p.seasonIndex)};episodeSearch.value='';renderEpisodes();renderContinuePanels();window.scrollTo({top:0,behavior:'smooth'});if(push)history.pushState({view:'episodes',key,seasonIndex},'',`#/${key}${seasonIndex!==null?'/s'+seasonIndex:''}`)}function openSeason(si,push=true){currentSeasonIndex=si;renderEpisodes();if(push)history.pushState({view:'episodes',key:currentSeriesKey,seasonIndex:si},'',`#/${currentSeriesKey}/s${si}`)}
function renderEpisodes(){const s=getSeries(currentSeriesKey);if(!s)return;const q=(episodeSearch.value||'').trim().toLowerCase();episodesGrid.innerHTML='';seasonTabs.innerHTML='';if(hasSeasons(s)){if(currentSeasonIndex===null)currentSeasonIndex=0;s.seasons.forEach((season,idx)=>{const b=document.createElement('button');b.className='seasonTab focusable '+(idx===currentSeasonIndex?'active':'');b.textContent=`${season.name} (${season.episodes.length})`;b.onclick=()=>openSeason(idx);seasonTabs.appendChild(b)})}const eps=hasSeasons(s)?s.seasons[currentSeasonIndex].episodes:s.episodes;seriesPill.textContent=hasSeasons(s)?`${s.seasons[currentSeasonIndex].name} • ${eps.length} eps`:`${eps.length} eps`;const w=watched();eps.map((ep,idx)=>({...ep,idx})).filter(ep=>!q||ep.title.toLowerCase().includes(q)).forEach(ep=>{const key=epKey(s.key,currentSeasonIndex,ep.idx);const div=document.createElement('button');div.className='ep focusable '+(w[key]?'watched':'');div.innerHTML=`<b>${escapeHtml(ep.title)}</b><small>${w[key]?'Assistido':'Clique para assistir'} • Enter/OK</small>`;div.onclick=()=>playEpisode(s.key,ep.idx,currentSeasonIndex);episodesGrid.appendChild(div)});if(!episodesGrid.children.length)episodesGrid.innerHTML='<div class="empty">Nenhum episódio encontrado.</div>';updateFocusable()}
function tryFullscreen(){try{if(playerWrap.requestFullscreen)playerWrap.requestFullscreen()}catch{}}function playEpisode(seriesKey,idx,seasonIndex=null,push=true){const s=getSeries(seriesKey),ep=getEpisode(seriesKey,seasonIndex,idx);if(!s||!ep)return;currentSeriesKey=seriesKey;currentSeasonIndex=seasonIndex;currentEpisodeIndex=idx;saveProgress(seriesKey,seasonIndex,idx);playerWrap.style.display='block';homeView.classList.add('hide');episodesView.classList.add('hide');frame.src=`https://drive.google.com/file/d/${ep.id}/preview`;playerTitle.textContent=`${s.name} — ${seasonIndex!==null?s.seasons[seasonIndex].name+' • ':''}${ep.title}`;setTimeout(tryFullscreen,250);setTimeout(showControls,300);scheduleAutoplay(seriesKey,idx,seasonIndex);if(push)history.pushState({view:'player',key:seriesKey,seasonIndex,idx},'',`#/${seriesKey}/play/${seasonIndex??'single'}/${idx}`)}function closePlayer(push=true){frame.src='';playerWrap.style.display='none';clearAutoplay();if(document.fullscreenElement){try{document.exitFullscreen()}catch{}}openEpisodes(currentSeriesKey,currentSeasonIndex,push)}function nextEpisode(){nextEpisodeAuto(currentSeriesKey,currentEpisodeIndex,currentSeasonIndex)}function scheduleAutoplay(seriesKey,idx,seasonIndex=null){clearAutoplay();autoplayTimer=setTimeout(()=>nextEpisodeAuto(seriesKey,idx,seasonIndex),(DURATIONS[seriesKey]??DEFAULT_EP_MINUTES)*60*1000)}function clearAutoplay(){if(autoplayTimer)clearTimeout(autoplayTimer);autoplayTimer=null}function nextEpisodeAuto(seriesKey,idx,seasonIndex=null){const s=getSeries(seriesKey);if(!s)return;markWatched(seriesKey,seasonIndex,idx);if(hasSeasons(s)&&seasonIndex!==null){let ni=idx+1,ns=seasonIndex;if(ni>=s.seasons[ns].episodes.length){ns++;ni=0;if(ns>=s.seasons.length)ns=0}playEpisode(seriesKey,ni,ns);return}playEpisode(seriesKey,(idx+1)%s.episodes.length,null)}function showControls(){controls.classList.add('show');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>controls.classList.remove('show'),3300)}

let focusables=[],focusIndex=0;function updateFocusable(){focusables=[...document.querySelectorAll('.focusable:not(.hide)')].filter(el=>el.offsetParent!==null)}function setFocus(i){updateFocusable();if(!focusables.length)return;focusIndex=(i+focusables.length)%focusables.length;focusables.forEach(x=>x.classList.remove('focused'));const el=focusables[focusIndex];el.classList.add('focused');el.focus({preventScroll:false});if(el.dataset.key)setHero(el.dataset.key)}function handleRemoteKeys(e){if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();setFocus(focusIndex+((e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1))}if(e.key==='Enter'){const el=document.activeElement;if(el&&el.classList.contains('focusable'))el.click()}}function renderAll(){if(episodesView.classList.contains('hide'))renderHome();else openEpisodes(currentSeriesKey,currentSeasonIndex,false)}renderHome();setTimeout(()=>setFocus(0),300);
