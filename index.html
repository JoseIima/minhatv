<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#05050a" />
    <title>Minha TV</title>
    <style>
        :root {
            --bg: #05050a;
            --card: #12121d;
            --card2: #191927;
            --txt: #fff;
            --muted: rgba(255, 255, 255, .72);
            --muted2: rgba(255, 255, 255, .52);
            --line: rgba(255, 255, 255, .12);
            --red: #e50914;
            --red2: #ff2d3a;
            --gold: #ffcc66;
            --green: #34d399;
            --shadow: 0 22px 70px rgba(0, 0, 0, .62);
            --r: 20px;
            --focus: 0 0 0 3px rgba(229, 9, 20, .42), 0 0 26px rgba(229, 9, 20, .45);
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: radial-gradient(1000px 520px at 15% -10%, rgba(229, 9, 20, .18), transparent 60%), radial-gradient(900px 520px at 95% 5%, rgba(76, 29, 149, .22), transparent 65%), linear-gradient(180deg, #05050a, #0b0b12 46%, #05050a);
            color: var(--txt);
            min-height: 100vh;
            overflow-x: hidden
        }

        button,
        input {
            font: inherit
        }

        button {
            color: inherit
        }

        .hide {
            display: none !important
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(180deg, rgba(5, 5, 10, .96), rgba(5, 5, 10, .72));
            border-bottom: 1px solid rgba(255, 255, 255, .07);
            backdrop-filter: blur(14px)
        }

        .topinner {
            max-width: 1440px;
            margin: 0 auto;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 950;
            letter-spacing: .2px;
            font-size: 19px;
            white-space: nowrap
        }

        .logoMark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--red), #9f1239);
            display: grid;
            place-items: center;
            box-shadow: 0 0 34px rgba(229, 9, 20, .45)
        }

        .logoMark:before {
            content: "▶";
            font-size: 13px;
            margin-left: 2px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .07);
            color: var(--muted);
            font-size: 12px;
            font-weight: 800
        }

        .spacer {
            flex: 1
        }

        .navActions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .searchBox {
            position: relative;
            min-width: min(480px, 72vw)
        }

        .searchBox span {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            opacity: .65
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, .34);
            border: 1px solid var(--line);
            color: #fff;
            padding: 12px 14px 12px 38px;
            border-radius: 14px;
            outline: none
        }

        input:focus,
        .btn:focus-visible,
        .card:focus-visible,
        .ep:focus-visible,
        .seasonTab:focus-visible {
            box-shadow: var(--focus);
            border-color: rgba(229, 9, 20, .75)
        }

        .btn {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .09);
            border-radius: 14px;
            padding: 11px 14px;
            cursor: pointer;
            font-weight: 900;
            transition: .18s transform, .18s background, .18s border-color;
            user-select: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px
        }

        .btn:hover,
        .btn.focused {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, .15);
            border-color: rgba(255, 255, 255, .24)
        }

        .primary {
            background: linear-gradient(135deg, var(--red), #b20710);
            border-color: rgba(229, 9, 20, .68)
        }

        .primary:hover,
        .primary.focused {
            background: linear-gradient(135deg, var(--red2), var(--red));
            box-shadow: 0 18px 44px rgba(229, 9, 20, .28)
        }

        .ghost {
            background: rgba(0, 0, 0, .28)
        }

        .wrap {
            max-width: 1440px;
            margin: 0 auto;
            padding: 18px
        }

        .hero {
            position: relative;
            min-height: 490px;
            border-radius: var(--r);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .09);
            box-shadow: var(--shadow);
            isolation: isolate;
            background: #111
        }

        .heroBg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transform: scale(1.04);
            filter: saturate(1.05) contrast(1.05)
        }

        .hero:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0, 0, 0, .88) 0%, rgba(0, 0, 0, .52) 42%, rgba(0, 0, 0, .12) 72%, rgba(0, 0, 0, .05)), linear-gradient(0deg, rgba(5, 5, 10, .92) 0%, rgba(5, 5, 10, .34) 45%, rgba(5, 5, 10, .1))
        }

        .heroContent {
            position: relative;
            z-index: 1;
            padding: 54px 34px;
            max-width: 760px;
            min-height: 490px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 14px
        }

        .eyebrow {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .heroTitle {
            font-size: clamp(34px, 6vw, 70px);
            line-height: .96;
            font-weight: 1000;
            letter-spacing: -1.4px;
            text-shadow: 0 12px 45px #000
        }

        .heroDesc {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.5;
            max-width: 680px
        }

        .heroActions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 5px
        }

        .hint {
            color: var(--muted2);
            font-size: 13px;
            margin-top: 5px
        }

        .sectionTitle {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
            margin: 26px 0 12px
        }

        .sectionTitle h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: -.3px
        }

        .sectionTitle small {
            color: var(--muted2);
            font-weight: 700
        }

        .row {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 2px 4px 18px;
            scroll-padding: 18px
        }

        .row::-webkit-scrollbar {
            height: 10px
        }

        .row::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .14);
            border-radius: 99px
        }

        .card {
            position: relative;
            min-width: 218px;
            width: 218px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .1);
            background: linear-gradient(180deg, var(--card2), var(--card));
            cursor: pointer;
            transition: .18s transform, .18s box-shadow, .18s border-color;
            outline: none
        }

        .card:hover,
        .card.focused {
            transform: translateY(-6px) scale(1.035);
            box-shadow: 0 22px 60px rgba(0, 0, 0, .72);
            border-color: rgba(255, 255, 255, .26);
            z-index: 5
        }

        .poster {
            width: 100%;
            height: 306px;
            display: block;
            object-fit: cover;
            background: #111
        }

        .cardGrad {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 55%;
            background: linear-gradient(0deg, rgba(0, 0, 0, .88), transparent);
            pointer-events: none
        }

        .fav {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 38px;
            height: 38px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, .56);
            border: 1px solid rgba(255, 255, 255, .2);
            font-size: 18px;
            z-index: 2
        }

        .fav.on {
            color: var(--gold)
        }

        .previewBadge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(229, 9, 20, .92);
            border-radius: 999px;
            padding: 6px 9px;
            font-size: 11px;
            font-weight: 950;
            z-index: 2;
            opacity: 0;
            transform: translateY(-4px);
            transition: .18s
        }

        .card:hover .previewBadge,
        .card.focused .previewBadge {
            opacity: 1;
            transform: none
        }

        .cardPad {
            position: relative;
            padding: 11px 12px 14px
        }

        .cardTitle {
            font-weight: 950;
            font-size: 14px;
            line-height: 1.18
        }

        .cardMeta {
            margin-top: 8px;
            color: var(--muted2);
            font-size: 12px;
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        .progressTrack {
            height: 5px;
            background: rgba(255, 255, 255, .14);
            border-radius: 999px;
            margin-top: 10px;
            overflow: hidden
        }

        .progressFill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--red), var(--red2));
            border-radius: 999px
        }

        .empty {
            border: 1px dashed rgba(255, 255, 255, .17);
            background: rgba(255, 255, 255, .04);
            border-radius: 18px;
            padding: 18px;
            color: var(--muted)
        }

        .crumbs {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            margin: 4px 0 14px;
            color: var(--muted)
        }

        .seriesHeader {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 22px;
            min-height: 230px;
            background: #111;
            margin-bottom: 16px
        }

        .seriesHeaderBg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(1px) saturate(1.05);
            transform: scale(1.04);
            opacity: .55
        }

        .seriesHeader:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0, 0, 0, .86), rgba(0, 0, 0, .38)), linear-gradient(0deg, rgba(5, 5, 10, .92), transparent)
        }

        .seriesHeaderContent {
            position: relative;
            z-index: 1;
            padding: 24px;
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 18px;
            align-items: end
        }

        .miniPoster {
            width: 110px;
            height: 156px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, .14);
            box-shadow: 0 18px 45px rgba(0, 0, 0, .55)
        }

        .seriesName {
            font-size: clamp(28px, 4vw, 46px);
            line-height: 1;
            font-weight: 1000;
            margin-bottom: 8px
        }

        .tabs {
            display: flex;
            gap: 10px;
            overflow: auto;
            padding: 2px 2px 14px;
            margin: 4px 0 10px
        }

        .seasonTab {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .07);
            border-radius: 999px;
            padding: 10px 14px;
            font-weight: 950;
            white-space: nowrap;
            cursor: pointer;
            outline: none
        }

        .seasonTab.active {
            background: linear-gradient(135deg, var(--red), #ad0610);
            border-color: rgba(229, 9, 20, .8)
        }

        .epGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px
        }

        .ep {
            position: relative;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, .1);
            background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .04));
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            transition: .18s transform, .18s background, .18s border-color;
            outline: none;
            min-height: 105px
        }

        .ep:hover,
        .ep.focused {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, .1);
            border-color: rgba(255, 255, 255, .25)
        }

        .ep b {
            display: block;
            font-size: 15px;
            margin-bottom: 8px
        }

        .ep small {
            color: var(--muted2)
        }

        .ep.watched {
            border-color: rgba(52, 211, 153, .35)
        }

        .ep.watched:after {
            content: "✓";
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-radius: 999px;
            background: rgba(52, 211, 153, .18);
            color: var(--green);
            display: grid;
            place-items: center;
            font-weight: 1000
        }

        .continuePanel {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 14px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, .12);
            background: linear-gradient(135deg, rgba(229, 9, 20, .14), rgba(255, 255, 255, .05));
            border-radius: 18px;
            padding: 12px;
            margin: 12px 0 18px
        }

        .continuePanel img {
            width: 80px;
            height: 110px;
            border-radius: 12px;
            object-fit: cover
        }

        .continuePanel b {
            display: block;
            font-size: 18px
        }

        .continuePanel span {
            display: block;
            color: var(--muted);
            margin-top: 5px
        }

        #playerWrap {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            z-index: 1000
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block
        }

        #playerControls {
            position: fixed;
            inset: 0;
            z-index: 1010;
            pointer-events: none;
            opacity: 0;
            transition: .22s opacity;
            background: linear-gradient(180deg, rgba(0, 0, 0, .64), transparent 24%, transparent 72%, rgba(0, 0, 0, .66))
        }

        #playerControls.show {
            opacity: 1
        }

        .playerTop {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto
        }

        .playerTitle {
            font-weight: 950;
            text-shadow: 0 4px 22px #000
        }

        .playerBottom {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 22px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            pointer-events: auto
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, .82);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 999px;
            padding: 11px 16px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, .55);
            transition: .22s
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        @media(max-width:720px) {
            .topinner {
                align-items: stretch
            }

            .spacer {
                display: none
            }

            .searchBox {
                min-width: 100%;
                order: 4
            }

            .hero,
            .heroContent {
                min-height: 430px
            }

            .heroContent {
                padding: 28px 20px
            }

            .card {
                min-width: 168px;
                width: 168px
            }

            .poster {
                height: 236px
            }

            .seriesHeaderContent {
                grid-template-columns: 80px 1fr;
                padding: 18px
            }

            .miniPoster {
                width: 80px;
                height: 114px
            }

            .continuePanel {
                grid-template-columns: 60px 1fr
            }

            .continuePanel .btn {
                grid-column: 1/-1;
                justify-content: center
            }

            .continuePanel img {
                width: 60px;
                height: 84px
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="topinner">
            <div class="logo"><span class="logoMark"></span>Minha TV <span class="pill" id="pillCount">—</span></div>
            <div class="spacer"></div>
            <div class="navActions"><button class="btn ghost focusable" id="homeBtn">🏠 Home</button><button
                    class="btn ghost focusable" id="favoritesBtn">⭐ Favoritos</button></div><label
                class="searchBox"><span>🔎</span><input id="globalSearch" class="focusable"
                    placeholder="Buscar donghua ou episódio..." /></label>
        </div>
    </header>
    <main class="wrap">
        <section id="homeView">
            <div class="hero" id="hero">
                <div class="heroBg" id="heroBg"></div>
                <div class="heroContent">
                    <div class="eyebrow" id="heroMeta"></div>
                    <div class="heroTitle" id="heroTitle">Minha Biblioteca</div>
                    <div class="heroDesc" id="heroDesc">Escolha um donghua e assista direto na TV.</div>
                    <div class="heroActions"><button class="btn primary focusable" id="heroContinue">▶
                            Continuar</button><button class="btn focusable" id="heroEpisodes">📺 Ver
                            episódios</button><button class="btn ghost focusable" id="heroFav">⭐ Favoritar</button>
                    </div>
                    <div class="hint">TV: use as setas para navegar, Enter/OK para abrir e Voltar/Esc para sair do
                        player.</div>
                </div>
            </div>
            <div id="continueHome"></div>
            <div class="sectionTitle">
                <h2 id="rowTitle">Donghuas</h2><small>Hover/seleção mostra detalhes no banner</small>
            </div>
            <div class="row" id="donghuaRow"></div>
        </section>
        <section id="episodesView" class="hide">
            <div class="crumbs"><button class="btn ghost focusable" id="backHome">⬅
                    Voltar</button><span>Donghua:</span><b id="seriesTitle">—</b><span class="pill"
                    id="seriesPill">—</span></div>
            <div class="seriesHeader">
                <div class="seriesHeaderBg" id="seriesHeaderBg"></div>
                <div class="seriesHeaderContent"><img class="miniPoster" id="seriesPoster" alt="">
                    <div>
                        <div class="eyebrow" id="seriesMeta"></div>
                        <div class="seriesName" id="seriesName">—</div>
                        <div class="heroDesc" id="seriesDesc">—</div>
                        <div class="heroActions"><button class="btn primary focusable" id="playFirstBtn">▶
                                Assistir</button><button class="btn ghost focusable" id="seriesFavBtn">⭐
                                Favoritar</button></div>
                    </div>
                </div>
            </div>
            <div id="continueSeries"></div><label class="searchBox"
                style="display:block;max-width:640px;margin-bottom:12px"><span>🔎</span><input id="episodeSearch"
                    class="focusable" placeholder="Buscar episódio..." /></label>
            <div class="tabs" id="seasonTabs"></div>
            <div class="epGrid" id="episodesGrid"></div>
        </section>
    </main>
    <div id="playerWrap"><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div id="playerControls">
            <div class="playerTop"><button class="btn ghost focusable" id="backBtn">⬅ Voltar</button>
                <div class="playerTitle" id="playerTitle">—</div>
            </div>
            <div class="playerBottom"><button class="btn ghost focusable" id="markWatchedBtn">✓ Marcar
                    visto</button><button class="btn primary focusable" id="nextBtn">Próximo episódio ▶</button></div>
        </div>
    </div>
    <div class="toast" id="toast">—</div>
    <script>
